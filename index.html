:root {
  /* one colour per line; white text on each is at least 5:1 */
  --H: #9a5a12; --J: #c8243a; --S: #0b63b5; --C: #0a7d4c;
  --line: var(--H);
  --ground: #f4f2ec; --sign: #ffffff; --ink: #1e1f22; --muted: #5b5850; --rule: #dad6cc;
  --sans: Hind, system-ui, sans-serif;
  /* the phone's own Japanese faces: Hiragino on iPhone, the family real signage uses */
  --ja: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Noto Sans JP', sans-serif;
  --serif: 'Source Serif 4', serif; /* not Georgia: it draws Greek ὸ and Latin ḕ as a letter plus a floating accent */
  --gutter: max(1.25rem, env(safe-area-inset-left));
  /* sign and text share one column edge, centred on wide screens */
  --inset: max(var(--gutter), calc((100% - 39rem) / 2));
  --ease: cubic-bezier(.16, 1, .3, 1);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --ground: #121316; --sign: #1c1e22; --ink: #e6e3dc; --muted: #a29e95; --rule: #34363b; }
}
[data-line=H] { --line: var(--H); } [data-line=J] { --line: var(--J); } [data-line=S] { --line: var(--S); } [data-line=C] { --line: var(--C); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 400 1.1875rem/1.62 var(--serif);
  -webkit-tap-highlight-color: transparent;
}
::selection { background: color-mix(in srgb, var(--line) 28%, transparent); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 3px solid var(--line); outline-offset: 3px; border-radius: 4px; }

/* ---------- the station sign ---------- */
.sign {
  background: var(--sign);
  border-top: 6px solid var(--line);
  padding-top: env(safe-area-inset-top);
  box-shadow: 0 1px 0 var(--rule), 0 10px 24px -18px rgb(0 0 0 / .35);
  font-family: var(--sans);
}
.lines {
  display: flex; align-items: center; justify-content: space-between;
  padding: .55rem var(--inset) 0;
}
.brand { font-weight: 700; font-size: .95rem; letter-spacing: .01em; }
.chips { display: flex; gap: .4rem; }
/* a 44px tap target around a small numbering-badge square */
.chip {
  --c: var(--H); position: relative; isolation: isolate;
  width: 2.75rem; height: 2.75rem; display: grid; place-items: center;
  font-weight: 700; font-size: 1rem; line-height: 1; color: var(--ink);
}
.chip::before {
  content: ''; position: absolute; inset: .4rem; z-index: -1; border-radius: .4rem;
  border: 3px solid var(--c); background: var(--sign);
}
.chip[data-code=J] { --c: var(--J); } .chip[data-code=S] { --c: var(--S); } .chip[data-code=C] { --c: var(--C); }
.chip[aria-current] { color: #fff; }
.chip[aria-current]::before { background: var(--c); }
@media (hover: hover) { .chip:not([aria-current]):hover::before { background: color-mix(in srgb, var(--c) 16%, var(--sign)); } }

.sign-face {
  display: grid; grid-template-columns: auto 1fr; align-items: start; gap: .95rem;
  padding: 1.1rem var(--inset) 1rem;
}
.badge {
  display: grid; place-content: center; text-align: center;
  width: 3.6rem; height: 3.6rem; border: 5px solid var(--line); border-radius: .65rem;
  background: var(--sign); color: var(--ink); font-family: var(--sans); font-weight: 700; line-height: .95;
  font-variant-numeric: tabular-nums;
}
.badge-line { font-size: .9rem; }
.badge-no { font-size: 1.55rem; }
.sign-name { min-width: 0; }
h1 {
  margin: 0; font-weight: 700; font-size: clamp(1.7rem, 7.2vw, 2.6rem); line-height: 1.08;
  letter-spacing: -.01em; text-wrap: balance; overflow-wrap: anywhere;
}
.ja { font-family: var(--ja); font-weight: 600; letter-spacing: .06em; }
.sign-ja { margin: 0 0 .3rem; font-size: 1rem; line-height: 1.3; }
.sign-sub .ja { display: block; font-size: .85em; margin-bottom: .15rem; }
.sign-sub { margin: .3rem 0 0; font-weight: 500; font-size: 1.05rem; line-height: 1.25; color: var(--muted); }

.band {
  display: flex; justify-content: space-between; gap: 1rem;
  background: var(--line); color: #fff;
  padding: 0 var(--inset); min-height: 2.9rem;
  /* the band points both ways, like the line on a station sign; flat at the start of an article */
  clip-path: polygon(0 50%, .9rem 0, calc(100% - .9rem) 0, 100% 50%, calc(100% - .9rem) 100%, .9rem 100%);
}
.band.terminus { clip-path: polygon(0 0, calc(100% - .9rem) 0, 100% 50%, calc(100% - .9rem) 100%, 0 100%); }
.band > * {
  display: flex; align-items: center; gap: .5rem; min-width: 0; max-width: 50%;
  font-weight: 500; font-size: .95rem; line-height: 1.2;
}
/* neighbouring station names wrap to two lines rather than lose their ends */
.band > * { padding-block: .45rem; text-align: left; }
.band > * > span:not(.badge) { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; }
.band-next { margin-left: auto; text-align: right; }
.band button:disabled { cursor: default; }
.band :focus-visible { outline-color: #fff; outline-offset: -3px; }
.band .badge.mini {
  flex: none; width: 1.75rem; height: 1.75rem; border: 2px solid #fff; border-radius: .35rem;
  background: #fff; color: #1e1f22;
}
.mini .badge-line { font-size: .5rem; }
.mini .badge-no { font-size: .8rem; }
.arrow { flex: none; width: .55rem; height: .7rem; fill: currentColor; }

.fine {
  margin: 0; padding: .6rem var(--inset) .75rem;
  font-size: .8rem; line-height: 1.4; color: var(--muted);
}
.fine:empty { display: none; }
.fine a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 2px; }
.fine a:last-child { white-space: nowrap; }

/* the one moment of motion: the next station slides into the sign */
.arriving .sign-name, .arriving .sign-face .badge { animation: arrive .6s var(--ease) both; }
.arriving .sign-face .badge { animation-duration: .45s; }
@keyframes arrive { from { transform: translateX(2.25rem); opacity: .25; } }

/* ---------- the reading column ---------- */
.text {
  padding: 1.6rem var(--inset) 0;
  hyphens: auto; -webkit-hyphens: auto; hanging-punctuation: first;
  font-optical-sizing: auto; text-rendering: optimizeLegibility;
}
.text p { margin: 0 0 1em; }
.text h2, .text h3, .text h4 { font-family: var(--sans); font-weight: 700; line-height: 1.2; margin: 2.1em 0 .55em; text-wrap: balance; hyphens: manual; }
.text h2 { font-size: 1.4rem; }
.text h3 { font-size: 1.18rem; }
.text h4 { font-size: 1.02rem; }
.text > :first-child { margin-top: 0; }
.text ul, .text ol { margin: 0 0 1em; padding-left: 1.3em; }
.text li { margin-bottom: .35em; }
.text blockquote { margin: 1.3em 0; padding-left: 1rem; border-left: 1px solid var(--rule); font-size: 1.06rem; }
.text .indent { margin: 0 0 1em 1.3em; }
.text sup, .text sub { line-height: 0; }
.text math[display=block] { display: block; margin: 1em 0; overflow-x: auto; }
.status { font-family: var(--sans); font-size: 1.05rem; color: var(--muted); margin: 0 0 1rem; }

/* ---------- arriving at the end of a chapter ---------- */
.arrive {
  margin-top: 2.75rem;
  padding: 0 var(--inset) calc(2.5rem + env(safe-area-inset-bottom));
  font-family: var(--sans);
}
.arrive:empty { display: none; }
.here-note { margin: 0 0 .6rem; font-size: .9rem; color: var(--muted); }
.diagram {
  display: flex; justify-content: space-between; align-items: center; position: relative;
  list-style: none; margin: 0 0 2.6rem; padding: 0 .1rem;
}
.diagram::before {
  content: ''; position: absolute; inset: 50% 0 auto; height: 4px; margin-top: -2px; border-radius: 2px;
  /* the stretch already travelled is solid, the line ahead is faint */
  background: linear-gradient(to right, var(--line) var(--done), color-mix(in srgb, var(--line) 30%, var(--ground)) var(--done));
}
.diagram li { position: relative; width: .85rem; height: .85rem; border-radius: 50%; background: var(--sign); border: 3px solid var(--line); }
.diagram .past { background: var(--line); }
.diagram .here { width: 1.3rem; height: 1.3rem; border: 4px solid var(--ink); background: var(--sign); }
.diagram span {
  position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: .4rem;
  font: 500 .72rem/1 var(--sans); color: var(--muted); font-variant-numeric: tabular-nums;
}
.diagram .here span { color: var(--ink); font-weight: 700; }

.next-sign {
  display: block; width: 100%; text-align: left;
  background: var(--sign); border: 1px solid var(--rule); border-radius: .5rem; overflow: hidden;
  box-shadow: 0 2px 4px -2px rgb(0 0 0 / .12), 0 12px 24px -16px rgb(0 0 0 / .3);
  transition: transform .2s var(--ease), box-shadow .2s var(--ease);
}
.next-sign:active { transform: scale(.985); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
@media (hover: hover) { .next-sign:hover { transform: translateY(-2px); } }
.next-sign[aria-disabled=true] { cursor: progress; }
.next-sign[aria-disabled=true] .next-name { color: var(--muted); }
.next-face { display: flex; align-items: center; gap: .9rem; padding: 1rem 1.1rem; }
.next-face .badge { width: 3rem; height: 3rem; border-width: 4px; }
.next-face .badge-line { font-size: .78rem; }
.next-face .badge-no { font-size: 1.25rem; }
/* つぎは (next) set vertically beside the badge, as Japanese text runs on narrow signs */
.tsugi { writing-mode: vertical-rl; font-family: var(--ja); font-weight: 600; font-size: .72rem; line-height: 1; letter-spacing: .1em; color: var(--muted); margin-left: -.4rem; }
.next-name { font-weight: 700; font-size: 1.45rem; line-height: 1.12; text-wrap: balance; overflow-wrap: anywhere; }
.next-band {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  background: var(--line); color: #fff; padding: .8rem 1.1rem; font-weight: 500; font-size: 1rem;
}
.next-band .arrow { width: .65rem; height: .8rem; }

.quiet {
  display: block; margin: 1rem auto 0; padding: .7rem .5rem; min-height: 2.75rem;
  font-family: var(--sans); font-weight: 500; font-size: .95rem; color: var(--muted);
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
}
.transfer-title { margin: 2.4rem 0 .7rem; font-size: 1.05rem; font-weight: 700; }
.transfer { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
.transfer-chip {
  display: flex; flex-direction: column; align-items: center; gap: .45rem;
  padding: .8rem .4rem; border: 1px solid var(--rule); border-radius: .5rem; background: var(--sign);
  font-weight: 500; font-size: .95rem;
}
.transfer-chip .ja { font-size: .8rem; margin-bottom: -.4rem; color: var(--muted); }
.transfer-title .ja { font-size: .85em; margin-right: .3em; }
.transfer-chip .badge { width: 2.6rem; height: 2.6rem; border-width: 4px; }
.transfer-chip .badge-line { font-size: .7rem; }
.transfer-chip .badge-no { font-size: 1.05rem; }
</style>
</head>
<body data-line="H">
<header class="sign" id="sign">
  <div class="lines">
    <span class="brand">Slow Line</span>
    <nav class="chips" id="chips" aria-label="Lines"></nav>
  </div>
  <div class="sign-face" id="sign-face"></div>
  <nav class="band" id="band" aria-label="Chapters"></nav>
  <p class="fine" id="fine"></p>
</header>
<main class="text" id="text" lang="en"></main>
<section class="arrive" id="arrive" aria-label="Next station"></section>
<script src="app.js"></script>
</body>
